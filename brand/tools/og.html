<!doctype html>
<!-- Social preview card (1200×630). Render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --allow-file-access-from-files --window-size=1200,630 --screenshot=scanit-web/static/og.png \
       file://$PWD/brand/tools/og.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f7f7f5;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    color: #1c1c1e;
    display: grid; grid-template-columns: 1fr 520px; align-items: center;
  }
  .copy { padding-left: 88px; }
  .lockup { display: flex; align-items: center; gap: 18px; }
  .lockup .mark { width: 93px; height: 76px; }
  .lockup .word { height: 60px; }
  h1 { font-size: 64px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 650; margin: 44px 0 0; max-width: 11ch; }
  .art { position: relative; height: 630px; }
  .disc { position: absolute; left: 40px; top: 80px; width: 460px; height: 460px; border-radius: 50%;
          background: radial-gradient(circle at 50% 55%, rgb(16 170 81 / 0.18), rgb(16 170 81 / 0.06) 70%, transparent 71%); }
  .mascot { position: absolute; left: 0; top: 70px; width: 500px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="lockup">
      <img class="mark" src="../logo-mark.svg" alt="">
      <img class="word" src="../wordmark.svg" alt="ScanItNow">
    </div>
    <h1>Scan smart. Spend with clarity.</h1>
  </div>
  <div class="art">
    <img class="mascot" src="../png/mascot.png" alt="">
  </div>
</body>
</html>
